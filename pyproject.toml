[project]
name = "heptokens"
version = "0.1.0"
authors = [{ name = "Samuel Klein"}, { name = "Jeffrey Krupa" }, {name = "Michael Kagan"}]
requires-python = ">=3.11"
dependencies = ["torchpq>=0.3.0.6,<0.4", "snakemake>=9.13.7,<10", "snakemake-executor-plugin-slurm>=2.0.0,<3", "atlasopenmagic>=1.9.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge", "pypi"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
heptokens = { path = ".", editable = true }

[tool.pixi.dependencies]
pre-commit = ">=4.3.0,<5"
lightning = ">=2.5.5,<3"
omegaconf = ">=2.3.0,<3"
h5py = ">=3.13.0,<4"
hydra-core = ">=1.3.2,<2"
mplhep = ">=0.4.1,<0.5"
pandas = ">=2.3.3,<3"
rich = ">=14.2.0,<15"
wandb = ">=0.22.3,<0.23"
scikit-learn = ">=1.3.1,<2"
vector-quantize-pytorch = "*"
# PyTorch (shared across platforms)
pytorch = { version = ">=2.4", channel = "pytorch" }
torchvision = { version = ">=0.19", channel = "pytorch" }
torchaudio = { version = ">=2.4", channel = "pytorch" }
awkward = ">=2.8.12,<3"
pyarrow = ">=10.0.1"

# Platform-specific dependencies
[tool.pixi.target.linux-64.dependencies]
pytorch-cuda = { version = "12.1.*", channel = "pytorch" }
cupy = { version = ">=13.0.0" }

[tool.pixi.tasks]
# Define useful developer tasks (optional)
lint = "pre-commit run --all-files"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (includes F401 - unused imports)
    "I",   # isort
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["heptokens"]
