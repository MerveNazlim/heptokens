---
_target_: heptokens.data.atlas_event_iterable.AtlasEventObjectIterableModule

data_path: /path/to/event_data.h5
data_paths:
data_domains:

# This iterable loader uses random file-level splits instead of loading all
# events and doing a global random event split. If data_domains is unset, files
# under a realdata directory are treated as data and the rest as MC.
split_by_domain: true
sampling_domain_fractions:
sampling_balance_by: valid_objects
sampling_num_samples:

train_frac: 0.7
val_frac: 0.15
test_frac: 0.15
seed: 42
n_classes: 1

num_workers: 3
batch_size: 1024
pin_memory: false
persistent_workers: false
multiprocessing_context:
chunk_size: 4096
transforms: {}

output_mode: object
object_type: jets
mask_input:

event_inputs:
  - common/event/pvx
  - common/event/pvy
  - common/event/pvz
  - common/event/mu

object_collections:
  - object_name: jets
    mask_input: common/jets/mask
    inputs:
      - common/jets/pt
      - common/jets/eta
      - common/jets/phi
      - common/jets/mass
      - common/jets/n_trk
      - atlas/jets/QG_nTracks
      - atlas/jets/QG_tracksWidth
      - atlas/jets/QG_tracksC1
      - atlas/jets/DL1d_pb
      - atlas/jets/DL1d_pc
      - atlas/jets/DL1d_pu
      - atlas/jets/GN2_pb
      - atlas/jets/GN2_pc
      - atlas/jets/GN2_pu

  - object_name: electrons
    mask_input: common/electrons/mask
    inputs:
      - common/electrons/pt
      - common/electrons/eta
      - common/electrons/phi
      - common/electrons/charge
      - atlas/electrons/LHMedium
      - atlas/electrons/LHTight
      - atlas/electrons/ptvarcone30
      - atlas/electrons/topoetcone20

  - object_name: muons
    mask_input: common/muons/mask
    inputs:
      - common/muons/pt
      - common/muons/eta
      - common/muons/phi
      - common/muons/charge
      # - common/muons/trk_iso03
      - atlas/muons/ptvarcone30
      - atlas/muons/topoetcone20

  - object_name: taus
    mask_input: common/taus/mask
    inputs:
      - common/taus/pt
      - common/taus/eta
      - common/taus/phi
      - common/taus/charge
      - atlas/taus/NNDecayMode
      - atlas/taus/RNNJetScore
      - atlas/taus/RNNEleScore

  - object_name: photons
    mask_input: common/photons/mask
    inputs:
      - common/photons/pt
      - common/photons/eta
      - common/photons/phi
      # - common/photons/trk_iso03
      - atlas/photons/isTight
      - atlas/photons/ptcone20
      - atlas/photons/topoetcone20
      - atlas/photons/topoetcone40

  - object_name: tracks
    mask_input: common/tracks/mask
    inputs:
      - common/tracks/pt
      - common/tracks/eta
      - common/tracks/phi
      - common/tracks/d0
      - common/tracks/z0
      - atlas/tracks/qOverP
      - atlas/tracks/chiSquared
      - atlas/tracks/nDoF

label_key:
num_events:
num_objects: 200
max_objects:
