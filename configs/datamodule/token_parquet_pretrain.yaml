---
_target_: heptokens.data.token_parquet.TokenParquetPretrainModule

prepared_dir:
train_parquet_files:
val_parquet_files:
parquet_files:  # Deprecated raw inputs; prepare train/val shards first.

train_frac: 0.9
val_frac: 0.1
seed: 42
max_sequences:
stream_batch_size: 4096
# Per DataLoader worker. At sequence length 256 this is roughly 35 MiB of
# token/mask/type tensors and mixes examples across multiple row groups.
shuffle_buffer_size: 8192

n_classes: 1
num_workers: 3
batch_size: 1024
pin_memory: true
persistent_workers: false
multiprocessing_context:
transforms:

token_column:
mask_column:
type_column:
