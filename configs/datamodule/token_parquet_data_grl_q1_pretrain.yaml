defaults:
  - token_parquet_pretrain
  - _self_

# Data-only Q1 Parquets are already split into train/ and val/ by the common
# (source_uri, event_index, seed=42) campaign split.  The datamodule must not
# perform a second split.
prepared_dir:
train_frac: 0.9
val_frac: 0.1
seed: 42
stream_batch_size: 4096
shuffle_buffer_size: 8192
num_workers: 3
batch_size: 448
include_tokens: true
token_column: tokens

