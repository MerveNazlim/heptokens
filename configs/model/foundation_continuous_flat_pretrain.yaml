_target_: heptokens.models.foundation_continuous.LitContinuousMaskedSequenceModel

architecture: flat
hidden_dim: 256
num_heads: 8
num_layers: 4
inner_num_heads: 4
inner_num_layers: 1
dropout: 0.1
max_seq_length: 256
num_type_ids: 12
mask_prob: 0.15
use_type_embedding: true
use_position_embedding: true
learning_rate: 1.0e-4

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-2
scheduler:
  _target_: heptokens.models.utils.warmup_cosine_scheduler
  _partial_: true
  warmup_epochs: 1
  min_lr: 1.0e-6
