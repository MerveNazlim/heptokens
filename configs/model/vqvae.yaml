---
# configs/model/vqvae.yaml
_target_: heptokens.models.vq_vae.LitVqVae
encoder:
  _target_: heptokens.models.coders.Encoder
  _partial_: true
  model:
    _target_: heptokens.models.coders.CoderModel
    _partial_: true
    hidden_dims: [128, 256, 512]
decoder:
  _target_: heptokens.models.coders.Decoder
  _partial_: true
  model:
    _target_: heptokens.models.coders.CoderModel
    _partial_: true
    hidden_dims: [128, 256, 512]
codebook_size: 512
codebook_dim: 6
num_quantizers: 3
dead_code_reset: false
dead_code_reset_interval: 1000
dead_code_reset_min_count: 0
dead_code_reset_max_fraction: 0.25
dead_code_reset_quantizers:
dead_code_reset_sample_size: 4096
learning_rate: 1e-3
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 1.0e-3
scheduler:
  _target_: heptokens.models.utils.warmup_cosine_scheduler
  _partial_: true
  warmup_epochs: 5
  min_lr: 1.0e-6
