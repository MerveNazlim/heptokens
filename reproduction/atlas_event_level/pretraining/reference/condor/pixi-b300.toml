[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
setuptools = "<82"
omegaconf = ">=2.3.0,<3"
hydra-core = ">=1.3.2,<2"
h5py = ">=3.13.0,<4"
mplhep = ">=0.4.1,<0.5"
pandas = ">=2.3.3,<3"
pyarrow = ">=10.0.1"
rich = ">=14.2.0,<15"
wandb = ">=0.22.3,<0.23"
scikit-learn = ">=1.3.1,<2"
awkward = ">=2.8.12,<3"

[pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130" }
lightning = "==2.5.5"
vector-quantize-pytorch = "*"
