defaults:
  - foundation_grouped_pretrain
  - _self_

# Independently trained FINAL Q4 tokenizers, not truncated Q8 codes.
# 4 x 64 = 256 matches the transformer input width of Q1/Q8 direct controls.
vocab_size: 262660
max_quantizers: 4
quantizer_embedding_dim: 64
object_projection_mode: identity
quantizer_decoder: parallel
ensure_masked_physical_object_per_event: true
