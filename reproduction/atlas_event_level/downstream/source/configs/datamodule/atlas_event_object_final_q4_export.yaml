---
# Export-only schema for the six saved FINAL Q4 tokenizers. Do not inherit the
# evolving training config: feature count AND order must match the checkpoints.
mask_input:
event_inputs:
  - common/event/pvx
  - common/event/pvy
  - common/event/pvz
  - common/event/mu

object_collections:
  - object_name: jets
    mask_input: common/jets/mask
    inputs:
      - common/jets/pt
      - common/jets/eta
      - common/jets/phi
      - common/jets/mass
      - common/jets/n_trk
      - atlas/jets/QG_nTracks
      - atlas/jets/QG_tracksWidth
      - atlas/jets/QG_tracksC1
      - atlas/jets/DL1d_pb
      - atlas/jets/DL1d_pc
      - atlas/jets/DL1d_pu
      - atlas/jets/GN2_pb
      - atlas/jets/GN2_pc
      - atlas/jets/GN2_pu

  - object_name: electrons
    mask_input: common/electrons/mask
    inputs:
      - common/electrons/pt
      - common/electrons/eta
      - common/electrons/phi
      - common/electrons/charge
      - atlas/electrons/LHMedium
      - atlas/electrons/LHTight
      - atlas/electrons/ptvarcone30
      - atlas/electrons/topoetcone20

  - object_name: muons
    mask_input: common/muons/mask
    inputs:
      - common/muons/pt
      - common/muons/eta
      - common/muons/phi
      - common/muons/charge
      - atlas/muons/ptvarcone30
      - atlas/muons/topoetcone20

  - object_name: taus
    mask_input: common/taus/mask
    inputs:
      - common/taus/pt
      - common/taus/eta
      - common/taus/phi
      - common/taus/charge
      - atlas/taus/NNDecayMode
      - atlas/taus/RNNJetScore
      - atlas/taus/RNNEleScore

  - object_name: photons
    mask_input: common/photons/mask
    inputs:
      - common/photons/pt
      - common/photons/eta
      - common/photons/phi
      - atlas/photons/isTight
      - atlas/photons/ptcone20
      - atlas/photons/topoetcone20
      - atlas/photons/topoetcone40

  - object_name: tracks
    mask_input: common/tracks/mask
    inputs:
      - common/tracks/pt
      - common/tracks/eta
      - common/tracks/phi
      - common/tracks/d0
      - common/tracks/z0
      - atlas/tracks/qOverP
      - atlas/tracks/chiSquared
      - atlas/tracks/nDoF
